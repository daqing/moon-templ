name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Fetch dependencies
        run: moon update

      # The checked-in `*_templ.mbt` files are compiled as part of their
      # packages, so denying warnings here also denies them in generated output:
      # a generator change that emits an unused parameter or a deprecated call
      # fails the build rather than warning at every user's build.
      - name: Check without warnings
        run: moon check --deny-warn

      - name: Test
        run: moon test --deny-warn
